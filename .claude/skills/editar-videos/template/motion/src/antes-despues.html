<!doctype html>
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  /* Full-frame overlay: navy frame with two transparent windows. The video under it is built to this geometry:
     left  window x=60  y=250 w=880 h=495 · right window x=980 y=250 w=880 h=495 · corner radius 18 px */
  #frame { position: absolute; left: 0; top: 0; }
  .lbl { position: absolute; top: 186px; display: flex; align-items: center; gap: 16px; white-space: nowrap; }
  .lbl .k { font-family: var(--font-mono); font-weight: 700; font-size: 26px; letter-spacing: 3px; padding: 8px 18px; border-radius: 999px; }
  .lbl .s { font-family: var(--font-display); font-weight: 600; font-size: 36px; letter-spacing: -.8px; }
  #la .k { color: var(--muted); background: color-mix(in srgb, var(--muted) 12%, transparent); border: 1px solid color-mix(in srgb, var(--muted) 30%, transparent); }
  #la .s { color: var(--muted); }
  #lb .k { color: var(--bg); background: var(--sky); }
  .tm { position: absolute; top: 772px; width: 880px; display: flex; align-items: center; gap: 26px; }
  .tm .clock { display: flex; align-items: center; gap: 12px; font-family: var(--font-mono); font-weight: 600; font-size: 54px;
    font-variant-numeric: tabular-nums; min-width: 250px; }
  .tm .clock svg { width: 38px; height: 38px; flex: none; }
  .tm .trk { position: relative; flex: 1; height: 14px; border-radius: 7px; background: var(--card); border: 1px solid var(--line); }
  .tm .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 7px; }
  .tm .end { position: absolute; top: -9px; width: 4px; height: 32px; border-radius: 2px; background: var(--line2); }
  #ta .clock { color: var(--muted); } #ta .fill { background: color-mix(in srgb, var(--dim) 64%, var(--line)); }
  #tb .clock { color: var(--text); } #tb .fill { background: linear-gradient(90deg, var(--sky), var(--blue)); box-shadow: 0 0 14px color-mix(in srgb, var(--sky) 50%, transparent); }
  .done { position: absolute; display: grid; place-items: center; width: 46px; height: 46px; border-radius: 50%; background: var(--sky);
    color: var(--bg); font-weight: 800; font-size: 26px; opacity: 0; }
  .delta { position: absolute; top: 180px; right: 60px; display: flex; align-items: center; gap: 12px; padding: 8px 22px 8px 10px; border-radius: 999px;
    background: color-mix(in srgb, var(--sky) 12%, transparent); border: 1px solid color-mix(in srgb, var(--sky) 45%, transparent); font-family: var(--font-display); font-weight: 600; font-size: 30px;
    color: var(--text); opacity: 0; white-space: nowrap; }
  .delta b { font-family: var(--font-mono); font-weight: 700; font-size: 30px; color: var(--bg); background: var(--sky); border-radius: 999px; padding: 4px 14px; }
</style></head>
<body>
<svg id="frame" data-ok="y" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <!-- vertical gradient on purpose: rows stay constant, so the PNG-in-MOV stays ~5x lighter than a radial glow -->
    <linearGradient id="gl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color: color-mix(in srgb, var(--deep) 24%, var(--card))"/><stop offset=".55" style="stop-color: var(--bg)"/><stop offset="1" style="stop-color: var(--bg)"/></linearGradient>
    <pattern id="dots" width="44" height="44" patternUnits="userSpaceOnUse"><circle cx="22" cy="22" r="1.5" fill-opacity=".1" style="fill: var(--muted)"/></pattern>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="10"/></filter>
    <clipPath id="outside"><path id="clipP" clip-rule="evenodd"/></clipPath>
  </defs>
  <path id="mask" fill-rule="evenodd" fill="url(#gl)"/>
  <path id="mask2" fill-rule="evenodd" fill="url(#dots)"/>
  <g clip-path="url(#outside)"><rect id="glowR" x="978" y="248" width="884" height="499" rx="20" fill="none" stroke-opacity=".55" stroke-width="6" filter="url(#glow)" style="stroke: var(--sky)"/></g>
  <rect x="57" y="247" width="886" height="501" rx="21" fill="none" stroke-width="3" style="stroke: var(--line2)"/>
  <rect x="977" y="247" width="886" height="501" rx="21" fill="none" stroke-width="3" style="stroke: var(--sky)"/>
</svg>
<div class="lbl" id="la" style="left: 60px"><span class="k">ANTES</span><span class="s" id="sa"></span></div>
<div class="lbl" id="lb" style="left: 980px"><span class="k">DESPUÉS</span><span class="s" id="sb"></span></div>
<div class="tm" id="ta" style="left: 60px"><span class="clock"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" style="stroke: var(--dim)"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9.5 2.5h5"/></svg><span id="ca">0:00,0</span></span><span class="trk"><span class="fill" id="fa"></span><span class="end" id="ea"></span></span></div>
<div class="tm" id="tb" style="left: 980px"><span class="clock"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" style="stroke: var(--sky)"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9.5 2.5h5"/></svg><span id="cb">0:00,0</span></span><span class="trk"><span class="fill" id="fb"></span><span class="end" id="eb"></span></span></div>
<span class="done" id="ok" data-ok="x">✓</span>
<p class="delta" id="delta"><b id="pct"></b>más corta</p>
<script src="base.js"></script>
<script>
(() => {
  // a = raw take length (s) · b = edited take length (s) · x = timer speed (use it if the clips under it play sped up)
  // la / lb = text after ANTES / DESPUÉS · cues: 0 = left timer starts · 1 = right timer starts (default = cue 0)
  $('sa').textContent = '· ' + str('la', 'en bruto'); $('sb').textContent = '· ' + str('lb', 'montado por Claude');
  const A = num('a', 42), B = num('b', 18), X = num('x', 1);
  const c0 = cue(0, 0.5), c1 = cue(1, c0);
  const rr = (x, y, w, h, r) => `M${x + r} ${y}H${x + w - r}A${r} ${r} 0 0 1 ${x + w} ${y + r}V${y + h - r}A${r} ${r} 0 0 1 ${x + w - r} ${y + h}`
    + `H${x + r}A${r} ${r} 0 0 1 ${x} ${y + h - r}V${y + r}A${r} ${r} 0 0 1 ${x + r} ${y}Z`;
  const d = 'M0 0H1920V1080H0Z' + rr(60, 250, 880, 495, 18) + rr(980, 250, 880, 495, 18);
  ['mask', 'mask2', 'clipP'].forEach((id) => $(id).setAttribute('d', d));   // the glow is clipped so it never tints the video
  const fmt = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')},${Math.floor((s * 10) % 10)}`;
  const M = Math.max(A, B), TW = 880 - 250 - 26;   // track width
  $('ea').style.left = (TW * A / M - 2) + 'px'; $('eb').style.left = (TW * B / M - 2) + 'px';
  const pct = Math.round((1 - B / A) * 100);
  $('pct').textContent = `−${pct} %`;
  // the ✓ sits right after the right timer's track end
  $('ok').style.left = (980 + 250 + 26 + TW * B / M + 16) + 'px'; $('ok').style.top = (772 + 2) + 'px';
  const tB = c1 + B / X, tA = c0 + A / X;
  tick((t) => {
    const sa = Math.min(A, Math.max(0, (t - c0) * X)), sb = Math.min(B, Math.max(0, (t - c1) * X));
    $('ca').textContent = fmt(sa); $('cb').textContent = fmt(sb);
    $('fa').style.width = (TW * sa / M) + 'px'; $('fb').style.width = (TW * sb / M) + 'px';
  });
  anim($('la'), 'slideR .45s .05s both var(--ease)');
  anim($('lb'), 'slideR .45s .2s both var(--ease)');
  anim($('ta'), 'riseS .45s .25s both var(--ease)');
  anim($('tb'), 'riseS .45s .35s both var(--ease)');
  anim($('ok'), `pop .45s ${tB}s both var(--ease)`);
  anim($('delta'), `riseS .5s ${Math.min(tA, tB + 1.2)}s both var(--ease)`);
})();
</script>
</body></html>
